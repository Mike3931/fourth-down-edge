name: Deploy

# Tests and the database migration check gate the deploy job — nothing
# reaches GitHub Pages without passing the same suite documented in the
# README. Pull requests run the test job as a check but never deploy;
# only a push to master (or a manual dispatch) can publish.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit & integration tests (calculations, api-client)
        run: npm test

      - name: Database migration validation (real Postgres engine, no Docker)
        run: npm run test:db

      - name: Typecheck & build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end journey test
        run: npx playwright test

  api:
    name: Analytical engine (Python)
    runs-on: ubuntu-latest
    # The engine runs against a real PostgreSQL service here, not the local
    # SQLite default, so schema portability is proven on every push.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fde_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      FDE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fde_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy

      - name: Migrations apply to PostgreSQL
        run: uv run alembic upgrade head

      # Network-marked tests download real provider data; they are excluded so
      # CI does not depend on an external service being up.
      - name: Tests
        run: uv run pytest tests -m "not network"

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GitHub Pages project sites are served under /<repo-name>/, not the
      # domain root, so this build uses --base=/fourth-down-edge/ (see
      # apps/web/package.json's build:pages script). The default `npm run
      # build` (root base) is for root-domain hosts like Vercel/Netlify —
      # do not swap this step for that one.
      - name: Build for GitHub Pages
        run: npm run build:pages -w @fde/web

      # GitHub Pages has no server-side rewrite rule for a project site, so a
      # direct navigation or refresh on a client-side route (e.g. /slate)
      # would 404 without this: GitHub Pages serves 404.html (verbatim here)
      # for any unmatched path, the SPA boots from it, and React Router's
      # basename resolves the real URL from window.location. Verified
      # locally against a server that reproduces this exact behavior.
      - name: Add SPA fallback for client-side routing
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
