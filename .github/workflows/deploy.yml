name: Deploy

# Tests and the database migration check gate the deploy job — nothing
# reaches GitHub Pages without passing the same suite documented in the
# README. Pull requests run the test job as a check but never deploy;
# only a push to master (or a manual dispatch) can publish.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit & integration tests (calculations, api-client)
        run: npm test

      - name: Database migration validation (real Postgres engine, no Docker)
        run: npm run test:db

      - name: Typecheck & build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end journey test
        run: npx playwright test

  api:
    name: Analytical engine (Python)
    runs-on: ubuntu-latest
    # The engine runs against a real PostgreSQL service here, not the local
    # SQLite default, so schema portability is proven on every push.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fde_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      FDE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fde_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy

      # --- independent gates -------------------------------------------- #
      # Every gate below carries `if: always()`. Steps stop on the first
      # failure by default, and that is how a failing chain test made the
      # recovery-concurrency result unknowable: the gate never ran, and a
      # step that never ran reports nothing while looking like it had no
      # work to do. These gates answer different questions, so one failing
      # must not erase another's answer.
      #
      # Lint and type check deliberately stay conditional: they decide
      # whether the code is runnable at all, and cascading their failure
      # into everything downstream produces noise, not information.
      - name: Migrations apply to PostgreSQL
        if: always()
        run: uv run alembic upgrade head

      # Proves the data migration against a table that already has rows.
      # A fresh-database migration cannot catch NOT-NULL-without-default or
      # a wrong legacy-state mapping.
      - name: Upgrade migration from the prior revision (PostgreSQL)
        if: always()
        run: uv run pytest tests/test_migration_upgrade.py -v

      - name: Downgrade and re-upgrade
        if: always()
        run: |
          uv run alembic downgrade 34134455937d
          uv run alembic upgrade head

      # Network-marked tests download real provider data; they are excluded so
      # CI does not depend on an external service being up.
      #
      # pg_concurrency is excluded HERE and run as its own gate below. Not
      # because it is optional, but so that a PostgreSQL race result is
      # independently visible rather than buried in a 500-test total where a
      # skip would look like a pass.
      - name: Tests
        if: always()
        run: uv run pytest tests -m "not network and not pg_concurrency and not pg_chain"

      # The scheduler-driven record chain, against the real database.
      #
      # Separate from the concurrency gate on purpose: this one is
      # FUNCTIONAL and single-connection. It proves the chain survives
      # PostgreSQL - UTC round trips, JSON lineage, boolean and enum
      # storage, rollback, unique constraints - and it makes no claim about
      # concurrency. Conflating the two would let a functional pass be read
      # as a concurrency result.
      # `if: always()` on both PostgreSQL gates. Steps stop on the first
      # failure by default, so a chain failure SKIPPED the concurrency gate
      # entirely - and a skipped gate reports nothing while looking like it
      # simply did not need to run. The two gates answer different
      # questions; one failing must not erase the other's answer.
      # The parity gate asserts on the JUnit RESULT, not the exit code. A
      # pytest run whose only selected test was skipped exits 0, so "the
      # suite passed" can equally mean parity was quietly not run - which is
      # exactly what happened for two increments while every CI run was
      # green. This fails on skipped, not just on failed.
      - name: Direct/scheduler parity gate
        if: always()
        run: uv run python scripts/verify_parity_junit.py

      - name: PostgreSQL record-chain gate
        if: always()
        run: uv run pytest tests -m "pg_chain" -v -s

      # The dedicated PostgreSQL concurrency gate.
      #
      # These tests FAIL if FDE_DATABASE_URL is absent rather than falling
      # back to SQLite. SQLite serialises writers at the file level, so a
      # race that "passes" there proves nothing about PostgreSQL row locking
      # - reporting that as verified would be worse than not running it.
      # Each test asserts the dialect and uses genuinely independent
      # connections released together from a barrier.
      - name: PostgreSQL recovery-lineage concurrency gate
        if: always()
        run: uv run pytest tests -m "pg_concurrency" -v -s

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gate on what actually ships. Production dependencies at high or
      # critical severity block the build; a vulnerability in the runtime
      # bundle is a vulnerability in the product.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      # Dev-only advisories are reported but do not gate. They are real and
      # worth fixing, but a linter's transitive dependency cannot reach a
      # user, and letting it block deploys trains everyone to bypass the
      # gate that does matter.
      - name: Audit all dependencies (informational)
        run: npm audit || true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Audit the LOCKFILE, not the built environment: pip-audit run against
      # the environment tries to look up the local unpublished fde-api
      # package on PyPI and fails on that rather than on any real finding.
      #
      # Known advisories are listed explicitly rather than suppressed by
      # lowering the severity threshold. The gate stays red for anything
      # NEW, which is the property worth having; each exception below is a
      # deliberate, reviewable decision recorded in docs/security.md.
      #
      # The six starlette advisories that were listed here are GONE:
      # starlette 0.48.0 -> 1.3.1 (with fastapi 0.116.2 -> 0.141.1) under
      # the model-integrity gate. Only pyarrow and a dev-only pytest
      # advisory remain, both still pending an upgrade decision.
      - name: Audit locked Python dependencies (blocking on new findings)
        working-directory: apps/api
        run: |
          uv export --no-emit-project --format requirements-txt --no-hashes -o /tmp/req.txt
          uv run --with pip-audit pip-audit --strict -r /tmp/req.txt \
            --ignore-vuln PYSEC-2026-113 \
            --ignore-vuln PYSEC-2026-1845

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, api, dependencies]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GitHub Pages project sites are served under /<repo-name>/, not the
      # domain root, so this build uses --base=/fourth-down-edge/ (see
      # apps/web/package.json's build:pages script). The default `npm run
      # build` (root base) is for root-domain hosts like Vercel/Netlify —
      # do not swap this step for that one.
      - name: Build for GitHub Pages
        run: npm run build:pages -w @fde/web

      # GitHub Pages has no server-side rewrite rule for a project site, so a
      # direct navigation or refresh on a client-side route (e.g. /slate)
      # would 404 without this: GitHub Pages serves 404.html (verbatim here)
      # for any unmatched path, the SPA boots from it, and React Router's
      # basename resolves the real URL from window.location. Verified
      # locally against a server that reproduces this exact behavior.
      - name: Add SPA fallback for client-side routing
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
