[project]
name = "fde-api"
version = "0.1.0"
description = "Fourth Down Edge analytical engine: reproducible NFL data ingestion, point-in-time features, transparent baseline models, walk-forward backtesting, and a typed FastAPI service. Research only — not approved for real-money decisions."
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "starlette>=1.3.1,<2",
    "uvicorn~=0.35.0",
    "pydantic~=2.11.7",
    "pydantic-settings~=2.10.1",
    "sqlalchemy~=2.0.43",
    "alembic~=1.16.4",
    "psycopg[binary]~=3.2.9",
    "polars~=1.32.2",
    "duckdb~=1.3.2",
    "pyarrow~=21.0.0",
    "pandas~=2.3.1",
    "numpy~=2.3.2",
    "scikit-learn~=1.7.1",
    "statsmodels~=0.14.5",
    "scipy~=1.16.1",
    "httpx~=0.28.1",
]

[dependency-groups]
dev = [
    "pytest~=8.4.1",
    "pytest-cov~=6.2.1",
    "hypothesis~=6.138.0",
    "ruff~=0.12.9",
    "mypy~=1.17.1",
    "pandas-stubs~=2.3.0.250703",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fde_api"]

[tool.uv]
# Lockfile (uv.lock) is committed; refresh only via `uv lock` deliberately.

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "SIM108",  # ternary is not always clearer
    "RUF001",  # typographic characters in prose/report strings are deliberate
    "RUF002",
    "RUF003",
    "E501",    # long lines: a handful of readable formulas/tables exceed 110
]

[tool.mypy]
python_version = "3.12"
# Pragmatic profile: full strictness fights the dynamic predictor protocol
# (models override fit/predict with narrower runtime types); these flags keep
# the checks that catch real bugs.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_incomplete_defs = false
mypy_path = "src"
packages = ["fde_api"]
# Analytical stack ships incomplete stubs; keep the strictness where it pays.
[[tool.mypy.overrides]]
module = [
    "statsmodels.*",
    "sklearn.*",
    "scipy.*",
    "duckdb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that download real provider data (deselect with '-m \"not network\"')",
    "postgres: tests that require a live PostgreSQL server (run in CI service container)",
    "pg_identity: PostgreSQL races proving the four domain logical identities are enforced by the database under contention. Fails rather than falling back to SQLite.",
    "pg_chain: the scheduler-driven record chain against a real PostgreSQL server (functional, single-connection; NOT a concurrency claim)",
    "pg_concurrency: genuine multi-connection PostgreSQL race tests. Selected by a dedicated CI gate; they FAIL rather than fall back when FDE_DATABASE_URL is absent, because a race silently downgraded to SQLite would be reported as verified when SQLite had serialised it away.",
]

[tool.coverage.run]
source = ["src/fde_api"]
