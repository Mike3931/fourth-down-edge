[alembic]
script_location = migrations
prepend_sys_path = src
# URL is resolved at runtime from FDE_DATABASE_URL (see migrations/env.py);
# this value is a placeholder that env.py overrides.
sqlalchemy.url = sqlite:///data/fde.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
